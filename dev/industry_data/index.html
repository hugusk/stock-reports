<style>
:root{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--ink-2:#adbac7;--ink-3:#768390;
  --grid:#30363d;--up:#f85149;--down:#4493f8;--accent:#3fb950;}
@media (prefers-color-scheme: light){:root{--bg:#f6f8fa;--card:#fff;--ink:#1f2328;
  --ink-2:#414851;--ink-3:#656d76;--grid:#d0d7de;--up:#cf222e;--down:#0969da;--accent:#1a7f37;}}
:root[data-theme=dark]{--bg:#0d1117;--card:#161b22;--ink:#e6edf3;--ink-2:#adbac7;--ink-3:#768390;--grid:#30363d;--up:#f85149;--down:#4493f8;--accent:#3fb950;}
:root[data-theme=light]{--bg:#f6f8fa;--card:#fff;--ink:#1f2328;--ink-2:#414851;--ink-3:#656d76;--grid:#d0d7de;--up:#cf222e;--down:#0969da;--accent:#1a7f37;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--ink-3);font-size:12.5px;margin-bottom:18px}
.sub a{color:var(--ink-2)}
.mkt-tabs{display:flex;gap:8px;margin-bottom:16px}
.mkt-tab{padding:7px 18px;border:1px solid var(--grid);border-radius:20px;background:var(--card);
  color:var(--ink-2);cursor:pointer;font-weight:600;font-size:13px}
.mkt-tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* 주가 겹쳐보기 칩 — 켜지면 해당 종목 선 색(--c)으로 채워져 차트 선과 짝이 보인다 */
.ovchip{display:inline-block;padding:2px 9px;margin-right:5px;border-radius:12px;cursor:pointer;
  border:1px solid var(--grid);color:var(--ink-2);font-size:11.5px;font-weight:600;
  background:var(--card);user-select:none;vertical-align:middle}
.ovchip:hover{border-color:var(--c)}
.ovchip.on{background:var(--c);border-color:var(--c);color:#fff}
.ovchip:focus-visible{outline:2px solid var(--c);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--grid);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 3px}
.card .cap{color:var(--ink-3);font-size:11.5px;margin-bottom:10px}
.chart{height:300px;width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.tl{text-align:left}
th{color:var(--ink-3);font-weight:600;font-size:11.5px;position:sticky;top:0;background:var(--card)}
.up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--ink-3)}
tr.prow:hover td{background:color-mix(in srgb, var(--accent) 8%, transparent)}
tr.prow.sel td, tr.hrow.sel td{background:color-mix(in srgb, var(--accent) 16%, transparent);font-weight:600}
.cat-h{margin:16px 0 6px;font-size:13px;color:var(--ink-2);font-weight:700}
.tbl-wrap{overflow-x:auto}
.hide{display:none}
body.embed h1,body.embed .sub{display:none}
body.embed .wrap{padding-top:8px}
/* HS 수출입 — 그룹 필터 칩 + 급등/급락 배지 */
.gchip{display:inline-block;padding:4px 12px;margin:0 5px 6px 0;border-radius:14px;cursor:pointer;
  border:1px solid var(--grid);background:var(--card);color:var(--ink-2);font-size:12px;font-weight:600;
  user-select:none}
.gchip:hover{border-color:var(--accent)}
.gchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gchip.hot.on{background:var(--up);border-color:var(--up)}
.badge{display:inline-block;padding:1px 6px;border-radius:9px;font-size:10.5px;font-weight:700;
  margin-left:6px;vertical-align:1px}
.badge.surge{background:color-mix(in srgb,var(--up) 18%,transparent);color:var(--up)}
.badge.slump{background:color-mix(in srgb,var(--down) 18%,transparent);color:var(--down)}
.grp-h td{background:color-mix(in srgb,var(--ink-3) 9%,transparent);font-weight:700;
  color:var(--ink-2);font-size:11.5px;letter-spacing:.3px;text-align:left}
.pill{display:inline-block;padding:3px 9px;margin:0 5px 5px 0;border-radius:12px;cursor:pointer;
  font-size:11.5px;font-weight:600;border:1px solid transparent}
.pill.surge{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up);
  border-color:color-mix(in srgb,var(--up) 35%,transparent)}
.pill.slump{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down);
  border-color:color-mix(in srgb,var(--down) 35%,transparent)}
.pill:hover{filter:brightness(1.15)}
</style></head>

  let h = '';
  h += '<div class="card"><h2 id="chart-title-gpu">GPU 렌탈가 추이</h2>'+
    '<div class="cap" id="chart-cap-gpu">USD/시간 (GPU당) · GPU 행을 클릭하면 개별 추이로 전환</div>'+
    ovChipsHtml('gpu')+'<div class="chart" id="chart-gpu"></div></div>';
  h += '<div class="card"><h2>GPU별 시간당 렌탈가</h2>'+
    '<div class="cap">기준 '+(gd.updated||gd.date||'–')+' · GPU당 USD/시간 · <span class="mut">70+ 클라우드 프로바이더 주간 집계 · 행 클릭 → 추이 차트(약 1년)</span></div>';
  h += '<div class="tbl-wrap"><table><thead><tr><th>GPU</th><th>$/h</th><th>전주대비</th><th>세그먼트</th><th>프로바이더</th><th>추이</th></tr></thead><tbody>';
  for(const name of Object.keys(gpus)){
    const v = gpus[name];
    const n = (H[name]||[]).length;
    const badge = n>=2 ? '<span class="mut">'+n+'주</span>' : '<span class="mut">–</span>';
    h += '<tr class="prow" data-mkt="gpu" data-item="'+name.replace(/"/g,'&quot;')+'" style="cursor:pointer">'+
      '<td>'+name+'</td><td>'+fmtNum(v.value)+'</td><td>'+fmtPct(v.change_pct)+'</td><td class="mut">'+(v.segment||'')+'</td><td class="mut">'+(v.providers||'–')+'</td><td>'+badge+'</td></tr>';
  }
  h += '</tbody></table></div></div>';
  return h;
}

/* ── 주가 오버레이 ─────────────────────────────────────────────
   산업 가격과 주가는 단위·자릿수가 달라 같은 축에 그대로 얹으면 한쪽이 납작해진다.
   그래서 오버레이를 켜면 **공통 시작점=100으로 지수화**해 '얼마나 움직였나'를 비교한다
   (가격 레벨은 표와 캡션에 그대로 남는다). */
const OV = (DATA.overlay||{}).stocks||{};
const OV_TICKERS = (DATA.overlay||{}).tickers||{};
const ovOn = {};   // mkt → Set(코드)
const OV_COLORS = ['#e8833a','#3b7dd8','#2e9e5b','#b05ccc'];

function ovChipsHtml(mkt){
  const list = OV_TICKERS[mkt]||[];
  if(!list.length || !Object.keys(OV).length) return '';
  let h = '<div class="cap" style="margin:2px 0 8px">주가 겹쳐보기 ';
  list.forEach(([code,name],i)=>{
    h += '<span class="ovchip" data-mkt="'+mkt+'" data-code="'+code+'" '+
         'style="--c:'+OV_COLORS[i%OV_COLORS.length]+'">'+name+'</span>';
  });
  h += '<span class="mut" style="margin-left:6px">켜면 시작점 100 기준 지수로 전환</span></div>';
  return h;
}

function ovIndex(series, fromDate){
  /* [[date, value], …] → 시작점 100 지수. fromDate 이후만 사용한다. */
  const rows = series.filter(p=>p[0]>=fromDate && p[1]);
  if(!rows.length) return [];
  const base = rows[0][1];
  return rows.map(p=>({time:p[0], value:+(p[1]/base*100).toFixed(2)}));
}

/* ── 수출입 (HS코드) ───────────────────────────────────────────
   관심목록(data/hs_watchlist.json) 전체를 그룹별로 채우고, 급등/급락만 배지로 표시한다.
   "어느 품목이 뜨는가"에서 "그래서 어느 종목인가"로 바로 넘어가는 게 이 표의 목적
   (HS↔종목 매핑 보유). 행을 누르면 월별 추이 + 10자리 세부품목 분해가 함께 열린다. */
const HS = (DATA.hs||{});
let hsSel = null, hsGroup = 'ALL', hsHot = false;

function fmtUsd(v){
  if(v==null) return '–';
  if(v>=1e9) return '$'+(v/1e9).toFixed(2)+'B';
  if(v>=1e6) return '$'+(v/1e6).toFixed(0)+'M';
  if(v>=1e3) return '$'+(v/1e3).toFixed(0)+'K';
  return '$'+v.toFixed(0);
}
function hsBadge(f){
  if(f==='surge') return '<span class="badge surge">급등</span>';
  if(f==='slump') return '<span class="badge slump">급락</span>';
  return '';
}
// 급등/급락을 발동시킨 지표를 골라 라벨로 만든다 — 둘 다 걸리면 폭이 큰 쪽
function hsTrigger(it){
  const s = HS.surge||{}, out = [];
  if(it.flag==='surge'){
    if(it.mom3!=null && it.mom3>=s.mom3) out.push(['3개월', it.mom3]);
    if(it.yoy !=null && it.yoy >=s.yoy ) out.push(['YoY',   it.yoy ]);
    out.sort((a,b)=>b[1]-a[1]);
  } else if(it.flag==='slump'){
    if(it.mom3!=null && it.mom3<=s.slump_mom3) out.push(['3개월', it.mom3]);
    if(it.yoy !=null && it.yoy <=s.slump_yoy ) out.push(['YoY',   it.yoy ]);
    out.sort((a,b)=>a[1]-b[1]);
  }
  return out.length ? out[0][0]+' '+fmtPct(out[0][1]) : '';
}
function hsVisible(){
  return (HS.items||[]).filter(it=>
    (hsGroup==='ALL' || it.group===hsGroup) && (!hsHot || it.flag));
}
function hsSectionHtml(){
  const items = HS.items||[];
  if(!items.length){
    return '<div class="card"><h2>수출입 (HS코드)</h2><div class="cap">'+
      (HS.has_key===false
        ? '관세청 API 키(TRADE_API_KEY)가 설정되지 않아 비어 있습니다. 키를 넣으면 다음 갱신부터 채워집니다.'
        : '데이터 누적 중입니다. <code>venv/bin/python3 -m industry_data.trade --collect</code>')+
      '</div></div>';
  }
  const s = HS.surge||{};
  const pk = it=>Math.max(it.mom3??-9e9, it.yoy??-9e9);   // 급등 강도
  const tr = it=>Math.min(it.mom3?? 9e9, it.yoy?? 9e9);   // 급락 강도
  const hot = items.filter(x=>x.flag==='surge').sort((a,b)=>pk(b)-pk(a));
  const cold = items.filter(x=>x.flag==='slump').sort((a,b)=>tr(a)-tr(b));

  // ① 급등·급락 요약 — 관심목록 전체 중 임계값을 넘은 것만 추려 맨 위에 둔다
  let h = '<div class="card"><h2>움직이는 품목</h2><div class="cap">기준 '+(HS.month||'')+
    ' · 급등 = 3개월 +'+s.mom3+'% 또는 YoY +'+s.yoy+'% · '+
    '급락 = 3개월 '+s.slump_mom3+'% 또는 YoY '+s.slump_yoy+'% · '+
    '최근 3개월 수출 $'+((s.min_export3||0)/1e6).toFixed(0)+'M 이상만 · '+
    '<span class="mut">칩을 누르면 해당 품목 차트로 이동</span></div>';
  if(hot.length) h += '<div style="margin-bottom:6px">'+hot.map(it=>
    '<span class="pill surge" data-jump="'+it.hs+'">🔥 '+(it.label||it.hs)+' '+
    hsTrigger(it)+'</span>').join('')+'</div>';
  if(cold.length) h += '<div>'+cold.map(it=>
    '<span class="pill slump" data-jump="'+it.hs+'">🧊 '+(it.label||it.hs)+' '+
    hsTrigger(it)+'</span>').join('')+'</div>';
  if(!hot.length && !cold.length)
    h += '<div class="mut">임계값을 넘은 품목이 없습니다 — 아래 표에서 전체 흐름을 보세요.</div>';
  h += '</div>';

  // ② 그룹 필터 + 전체 표
  h += '<div class="card"><h2>관심 품목 '+items.length+'개</h2>'+
    '<div class="cap">관세청 품목별 수출입실적 · 관심목록은 '+
    '<code>data/hs_watchlist.json</code>에서 직접 편집 · '+
    '<span class="mut">행 클릭 → 월별 추이 + 세부품목</span></div>';
  h += '<div style="margin-bottom:10px">'+
    '<span class="gchip on" data-grp="ALL">전체</span>'+
    (HS.groups||[]).map(g=>'<span class="gchip" data-grp="'+g+'">'+g+'</span>').join('')+
    '<span class="gchip hot" data-hot="1">🔥 움직인 것만</span></div>';
  h += '<div class="tbl-wrap"><table><thead><tr><th>HS</th><th class="tl">품목</th><th>수출 3개월</th>'+
    '<th>3개월 추세</th><th>YoY</th><th>수입 YoY</th><th class="tl">연결 종목</th></tr></thead>'+
    '<tbody id="hs-tbody">'+hsRowsHtml()+'</tbody></table></div></div>';

  // ③ 차트 + 세부품목
  h += '<div class="card"><h2 id="chart-title-hs">월별 수출입 추이</h2>'+
    '<div class="cap" id="chart-cap-hs">USD · 품목 행을 클릭하면 전환</div>'+
    '<div class="chart" id="chart-hs"></div>'+
    '<div id="hs-subs"></div></div>';
  return h;
}
function hsRowsHtml(){
  const rows = hsVisible();
  if(!rows.length) return '<tr><td colspan="7" class="mut">해당 조건의 품목이 없습니다.</td></tr>';
  let h = '', lastG = null;
  for(const it of rows){
    if(hsGroup==='ALL' && it.group!==lastG){
      lastG = it.group;
      h += '<tr class="grp-h"><td colspan="7">'+it.group+'</td></tr>';
    }
    const names = (it.tickers||[]).map(t=>t.name).join(', ') || '–';
    h += '<tr class="hrow'+(it.hs===hsSel?' sel':'')+'" data-hs="'+it.hs+'" style="cursor:pointer">'+
      '<td class="mut">'+it.hs+'</td>'+
      '<td class="tl">'+(it.label||'')+hsBadge(it.flag)+'</td>'+
      '<td>'+fmtUsd(it.export3)+'</td>'+
      '<td>'+fmtPct(it.mom3)+'</td><td>'+fmtPct(it.yoy)+'</td><td>'+fmtPct(it.imp_yoy)+'</td>'+
      '<td class="mut tl">'+names+'</td></tr>';
  }
  return h;
}
function hsSubsHtml(it){
  const subs = it.subs||[];
  if(!subs.length) return '';
  let h = '<div class="cat-h">세부품목 — '+it.hs+' 하위 '+subs.length+'종 (최근 3개월 수출 순)</div>'+
    '<div class="tbl-wrap"><table><thead><tr><th>세부 HS</th><th class="tl">품목명</th>'+
    '<th>수출 3개월</th><th>3개월 추세</th><th>YoY</th></tr></thead><tbody>';
  for(const s of subs){
    h += '<tr><td class="mut">'+s.code+'</td><td class="tl">'+(s.name||'')+'</td>'+
      '<td>'+fmtUsd(s.export3)+'</td><td>'+fmtPct(s.mom3)+'</td><td>'+fmtPct(s.yoy)+'</td></tr>';
  }
  return h+'</tbody></table></div>';
}
function drawHsChart(hs){
  const items = HS.items||[];
  const it = items.find(x=>x.hs===hs) || hsVisible()[0] || items[0];
  if(!it) return;
  hsSel = it.hs;
  const t=document.getElementById('chart-title-hs'), cap=document.getElementById('chart-cap-hs');
  if(t) t.innerHTML = '월별 수출입 추이 — '+it.hs+' '+(it.label||'')+hsBadge(it.flag);
  if(cap) cap.textContent = 'USD · '+it.series.length+'개월 ('+it.series[0][0]+'~'+
    it.series[it.series.length-1][0]+') · 연결 종목 '+
    ((it.tickers||[]).map(x=>x.name).join(', ')||'–');
  const sub=document.getElementById('hs-subs'); if(sub) sub.innerHTML = hsSubsHtml(it);
  const el=document.getElementById('chart-hs'); if(!el) return;
  if(charts.hs){ charts.hs.remove(); charts.hs=null; }
  const chart = charts.hs = LWC.createChart(el,{
    layout:{background:{color:'transparent'},textColor:cssVar('--ink-3'),attributionLogo:false},
    grid:{vertLines:{color:cssVar('--grid')},horzLines:{color:cssVar('--grid')}},
    rightPriceScale:{borderColor:cssVar('--grid')},
    timeScale:{borderColor:cssVar('--grid')},
    // 수출액은 수백억 달러 단위라 기본 포맷이면 축에 38235698070.00 같은 숫자가 찍힌다
    localization:{priceFormatter:fmtUsd}, autoSize:true});
  // 월별 데이터라 날짜는 해당 월 1일로 맞춘다(LWC는 YYYY-MM-DD를 요구)
  const mk = (idx,color,title)=>{
    const sr = chart.addSeries(LWC.LineSeries,{color:color,lineWidth:2,title:title});
    sr.setData(it.series.filter(r=>r[idx]!=null).map(r=>({time:r[0]+'-01',value:r[idx]})));
  };
  mk(1, '#e8833a', '수출');
  mk(2, '#3b7dd8', '수입');
  chart.timeScale().fitContent();
}
function bindHsRows(){
  document.querySelectorAll('#hs-tbody .hrow').forEach(r=>r.addEventListener('click',()=>{
    document.querySelectorAll('#hs-tbody .hrow').forEach(x=>x.classList.remove('sel'));
    r.classList.add('sel');
    drawHsChart(r.dataset.hs);
    document.getElementById('chart-hs').scrollIntoView({behavior:'smooth',block:'nearest'});
  }));
}
function hsRedraw(){
  const tb=document.getElementById('hs-tbody'); if(!tb) return;
  tb.innerHTML = hsRowsHtml();
  bindHsRows();
}

const selected = {};  // mkt → 현재 선택 제품
function drawChart(mkt, item){
  const H = mkt==='gpu' ? ((DATA.gpu||{}).history||{}) : ((DATA.history||{})[mkt]||{});
  // item 미지정: 대표 제품(가장 포인트 많은 제품) 기본
  if(!item){
    if(mkt==='gpu'){
      item = Object.keys(H).sort((a,b)=>((H[b]||[]).length-(H[a]||[]).length))[0]
        || Object.keys((DATA.gpu||{}).gpus||{})[0];
    } else {
      const rep = (DATA[mkt+'_history']||{}).product;
      item = (rep && H[rep]) ? rep : Object.keys(H).sort((a,b)=>(H[b].length-H[a].length))[0];
    }
  }
  const series = H[item] || [];
  selected[mkt] = item;
  const t = document.getElementById('chart-title-'+mkt);
  const cap = document.getElementById('chart-cap-'+mkt);
  if(t) t.textContent = '가격 추이 — ' + (item||'');
  if(cap) cap.textContent = series.length>=2
    ? ('USD · '+series.length+'개 데이터 ('+series[0][0]+'~'+series[series.length-1][0]+')')
    : 'USD · 누적 중 — 매일 1포인트씩 쌓입니다 (현재 '+series.length+'개)';
  const el = document.getElementById('chart-'+mkt);
  if(!el) return;
  if(charts[mkt]){ charts[mkt].remove(); charts[mkt]=null; }
  const line = cssVar('--accent');
  const chart = charts[mkt] = LWC.createChart(el,{
    layout:{background:{color:'transparent'},textColor:cssVar('--ink-3'),attributionLogo:false},
    grid:{vertLines:{color:cssVar('--grid')},horzLines:{color:cssVar('--grid')}},
    rightPriceScale:{borderColor:cssVar('--grid')},
    timeScale:{borderColor:cssVar('--grid')},
    autoSize:true});
  const on = ovOn[mkt] && ovOn[mkt].size ? ovOn[mkt] : null;
  if(!on){
    // 오버레이 없음 — 실제 가격(USD) 그대로
    const s = chart.addSeries(LWC.AreaSeries,{lineColor:line,topColor:line+'44',bottomColor:line+'08',lineWidth:2,
      pointMarkersVisible:series.length<8});
    s.setData(series.map(p=>({time:p[0],value:p[1]})));
  } else {
    // 오버레이 켜짐 — 산업 가격과 주가를 공통 시작점 100으로 지수화해 같은 축에서 비교
    const from = series.length ? series[0][0] : '';
    const s = chart.addSeries(LWC.LineSeries,{color:line,lineWidth:2.4,title:'가격(지수)'});
    s.setData(ovIndex(series, from));
    s.createPriceLine({price:100, color:cssVar('--ink-3'), lineWidth:1, lineStyle:2, axisLabelVisible:false});
    (OV_TICKERS[mkt]||[]).forEach(([code,name],i)=>{
      if(!on.has(code) || !OV[code]) return;
      const ls = chart.addSeries(LWC.LineSeries,
        {color:OV_COLORS[i%OV_COLORS.length], lineWidth:1.8, title:name});
      ls.setData(ovIndex(OV[code].series, from));
    });
    if(cap) cap.textContent = (cap.textContent||'') + ' · 시작점 100 기준 지수 비교';
  }
  chart.timeScale().fitContent();
}
function highlightRow(mkt, item){
  document.querySelectorAll('#'+mkt+'-sec .prow').forEach(r=>{
    r.classList.toggle('sel', r.dataset.item.replace(/&quot;/g,'"')===item);
  });
}

document.getElementById('sub').innerHTML =
  '출처: '+(DATA.source||'DRAMeXchange')+' · 갱신 '+((DATA.updated||'').replace('T',' ').slice(0,16));
document.getElementById('dram-sec').innerHTML = sectionHtml('dram');
document.getElementById('nand-sec').innerHTML = sectionHtml('nand');
document.getElementById('gpu-sec').innerHTML = gpuSectionHtml();
document.getElementById('hs-sec').innerHTML = hsSectionHtml();

function bindOvChips(){
  document.querySelectorAll('.ovchip').forEach(ch=>ch.addEventListener('click',()=>{
    const mkt=ch.dataset.mkt, code=ch.dataset.code;
    ovOn[mkt] = ovOn[mkt] || new Set();
    if(ovOn[mkt].has(code)) ovOn[mkt].delete(code); else ovOn[mkt].add(code);
    ch.classList.toggle('on', ovOn[mkt].has(code));
    drawChart(mkt, selected[mkt]);
  }));
}

function bindRows(){
  document.querySelectorAll('.prow').forEach(r=>r.addEventListener('click',()=>{
    const mkt=r.dataset.mkt, item=r.dataset.item.replace(/&quot;/g,'"');
    drawChart(mkt,item); highlightRow(mkt,item);
    document.getElementById('chart-'+mkt).scrollIntoView({behavior:'smooth',block:'nearest'});
  }));
}
bindRows();
bindOvChips();
bindHsRows();
// 그룹 필터 칩 — '전체/그룹'은 단일 선택, '움직인 것만'은 독립 토글
document.querySelectorAll('.gchip').forEach(ch=>ch.addEventListener('click',()=>{
  if(ch.dataset.hot){
    hsHot = !hsHot;
    ch.classList.toggle('on', hsHot);
  } else {
    hsGroup = ch.dataset.grp;
    document.querySelectorAll('.gchip[data-grp]').forEach(x=>
      x.classList.toggle('on', x.dataset.grp===hsGroup));
  }
  hsRedraw();
}));
// 급등·급락 칩 → 해당 품목으로 이동 (필터에 가려져 있으면 전체로 되돌린다)
document.querySelectorAll('.pill[data-jump]').forEach(pl=>pl.addEventListener('click',()=>{
  const hs = pl.dataset.jump;
  if(!hsVisible().some(x=>x.hs===hs)){
    hsGroup='ALL'; hsHot=false;
    document.querySelectorAll('.gchip').forEach(x=>
      x.classList.toggle('on', x.dataset.grp==='ALL'));
    hsRedraw();
  }
  drawHsChart(hs);
  document.querySelectorAll('#hs-tbody .hrow').forEach(x=>
    x.classList.toggle('sel', x.dataset.hs===hs));
  document.getElementById('chart-hs').scrollIntoView({behavior:'smooth',block:'nearest'});
}));
drawChart('dram'); highlightRow('dram', selected['dram']);

document.querySelectorAll('.mkt-tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.mkt-tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  const mkt=t.dataset.mkt;
  document.getElementById('dram-sec').classList.toggle('hide',mkt!=='dram');
  document.getElementById('nand-sec').classList.toggle('hide',mkt!=='nand');
  document.getElementById('gpu-sec').classList.toggle('hide',mkt!=='gpu');
  document.getElementById('hs-sec').classList.toggle('hide',mkt!=='hs');
  if(mkt==='hs'){ drawHsChart(hsSel); return; }
  drawChart(mkt, selected[mkt]); highlightRow(mkt, selected[mkt]);
  if(charts[mkt]) charts[mkt].timeScale().fitContent();
}));
</script>
</body></html>
